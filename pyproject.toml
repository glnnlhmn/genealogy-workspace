# Path: pyproject.toml
# ==============================================================================
# Genealogy Digital Archive (GDA) - Project Configuration
# Governs PEP 517/621 builds, runtime toolchains, test harnesses, and environments.
# Canonical Workspace Root: G:/My Drive/genealogy-workspace
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. BUILD SYSTEM CONFIGURATION
# ------------------------------------------------------------------------------
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# ------------------------------------------------------------------------------
# 2. CORE PROJECT METADATA & RUNTIME DEPENDENCIES
# ------------------------------------------------------------------------------
[project]
name = "genealogy-digital-archive"
version = "1.0.0+build.7"
description = "Consolidated Digital Archive Engine, CLI, GenDesk Tools & Ancestry Desk UI"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Glenn D. Lehman", email = "glnn.lhmn@gmail.com" }
]
dependencies = [
    "pydantic>=2.6.0",          # Immutable model schemas and type contracts
    "pydantic-settings>=2.2.0", # Environment setting loading and resolution
    "pandas>=2.2.0",            # Tabular analysis and dataset parsing
    "pyarrow>=15.0.0",          # Columnar in-memory data representations
    "jsonschema>=4.26.0",       # Schema validation for profiles and metadata
    "referencing>=0.30.0",      # JSON Schema URI dereferencing
    "rapidfuzz>=3.0.0",         # Onomastic phonetic matching and string distance
    "rich>=13.0.0",             # Rich terminal formatting and system display
    "us>=3.1.1",                # United States geographical authority data
    "pycountry>=24.6.1",        # ISO standard country code lookups
    "tomlkit>=0.13.0",          # Comment-preserving TOML manipulation
]

# ------------------------------------------------------------------------------
# 3. CLI ENTRYPOINTS & OPTIONAL DEPENDENCY TIERS
# ------------------------------------------------------------------------------

# --- 3.1 Console Script Entrypoints ---
[project.scripts]
# Uncomment each GDT entrypoint as its package migration completes:
gdrm = "gen_desk_tools.readme_gen.cli:main"
gdb = "gen_desk_tools.backup_mgr.cli:main"
gd-metrics = "gen_desk_tools.metrics.cli:main"
gd-gaps = "gen_desk_tools.coverage_gaps.cli:main"
gd-struct = "gen_desk_tools.structure.cli:main"
gsi = "gen_desk_tools.script_importer.cli:main"  # Migrate last

# --- 3.2 Optional & Development Dependency Groups ---
[project.optional-dependencies]
docs = [
    "sphinx>=7.2.0",            # Documentation generator
    "pydata-sphinx-theme>=0.15.0",
    "myst-parser>=2.0.0",       # Markdown-to-Sphinx parser
    "sphinx-autodoc-typehints>=2.0.0",
]
test = [
    "pytest>=8.0.0",            # Core test runner
    "pytest-cov>=5.0.0",        # Statement and branch coverage plugin
    "pytest-mock>=3.12.0",      # Unittest.mock fixture wrapper
    "pytest-xdist>=3.5.0",      # Parallel test execution worker pool
]
ui = [
    "textual>=0.50.0",          # Ancestry Desk terminal UI engine
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.8.0",              # Unified Python 3.13 linter, formatter, and import sorter
    "mypy>=1.8.0",              # Static type checker
    "radon>=6.0.0",             # Cyclomatic complexity (cc), maintainability (mi), and raw SLOC analyzer
    "jupyterlab>=4.0.0",
    "notebook>=7.0.0",
    "ipykernel>=6.0.0",
]

# ------------------------------------------------------------------------------
# 4. PACKAGE DISCOVERY & SOURCE DIRECTORY MAPPINGS
# ------------------------------------------------------------------------------
[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["gda*", "gen_desk_tools*", "ancestry_desk*", "cli*", "system*"]

# ------------------------------------------------------------------------------
# 5. PYTEST HARNESS & TEST RUNNER SETTINGS
# ------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
# Route temporary test directories to local C:/temp/pytest_tmp to avoid Google Drive file-locking
addopts = "-ra -q --basetemp=C:/temp/pytest_tmp --strict-markers --import-mode=importlib"
testpaths = [
    "tests/test_gda",
    "tests/test_gen_desk_tools",
    "tests/test_system",
]
pythonpath = ["src"]
markers = [
    "smoke: Fast sanity checks executed prior to commit (< 5s)",
    "regression: Boundary, edge case, and defect tests verifying defensive rules",
    "integration: Multi-component, filesystem, and external subprocess operations",
    "unit: Isolated in-memory component tests with zero disk I/O",
    "integrity: Whole-archive schema, enum parity, and manifest drift verification",
]

# ------------------------------------------------------------------------------
# 6. CODE COVERAGE GATES (pytest-cov)
# ------------------------------------------------------------------------------
[tool.coverage.run]
branch = true                   # Require both statement and branch path coverage
source = ["src"]
omit = [
    "tests/*",
    "temp/*",
    "gtemp/*",
    "*/__init__.py",
]

[tool.coverage.report]
fail_under = 95                 # Minimum workspace-wide gate (individual packages target 100%)
precision = 2
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

# ------------------------------------------------------------------------------
# 7. RUFF LINTING, FORMATTING & IMPORT SORTING
# ------------------------------------------------------------------------------
[tool.ruff]
line-length = 100               # Canonical GDA 100-column width
target-version = "py313"        # Enforce PEP 695 generics and modern Python 3.13 syntax
src = ["src", "tests"]
extend-exclude = [
    "archive",
    "download",
    "temp",
    "gtemp",
    "logs",
    "reports",
]

# --- 7.1 Lint Rules & Import Sorting ---
[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes (syntax/unused variables/missing imports)
    "I",  # isort (clean, deterministic import sorting)
    "UP", # pyupgrade (modern Python 3.13 syntax upgrades)
    "B",  # flake8-bugbear (common design bugs and antipatterns)
]
ignore = [
    "E501", # Line length violations (handled directly by ruff format)
]

[tool.ruff.lint.isort]
known-first-party = ["gda", "gen_desk_tools", "ancestry_desk", "cli", "system"]

[tool.ruff.lint.mccabe]
# Set the maximum acceptable cyclomatic complexity (Radon CC target: average Grade A)
max-complexity = 10

# --- 7.2 Code Formatting ---
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"              # Enforce LF line endings across Windows/POSIX
docstring-code-format = true

# ------------------------------------------------------------------------------
# 8. MYPY STATIC TYPE CHECKING & PYDANTIC PLUGIN
# ------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"         # Validate PEP 695 type parameters and Python 3.13 stdlib types
plugins = ["pydantic.mypy"]     # Type-check Pydantic v2 @dataclass and BaseModel contracts
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true       # Type-check bodies of functions even if annotations are omitted
disallow_untyped_defs = false
warn_return_any = true          # Flag functions returning unconstrained Any
warn_unused_configs = true
warn_redundant_casts = true     # Flag unnecessary typing.cast() calls
warn_unused_ignores = true      # Flag stale # type: ignore[...] comments
show_error_codes = true
pretty = true

[tool.pydantic-mypy]
init_forbid_extra = true        # Reject unexpected keyword arguments in @dataclass constructors
init_typed = true               # Enforce strict field types in generated __init__ signatures
warn_required_dynamic_aliases = true

# ------------------------------------------------------------------------------
# 9. GDA CANONICAL WORKSPACE STORAGE ROOTS
# ------------------------------------------------------------------------------
[tool.gda.storage]
profiles_dir = "data/profiles"            # JSON user/researcher profile configurations
reference_dir = "data/reference"          # Read-only reference authorities and lookup tables
archive_dir = "archive"                   # Root archival storage directory
backup_root = "archive/backups_workspace" # Default workspace-level backup destination

# ------------------------------------------------------------------------------
# 10. GDA RUNTIME & ENVIRONMENT DATABASE CONFIGURATION
# ------------------------------------------------------------------------------
[tool.gda]
app_name = "Genealogy Digital Archive"
environment = "development"
debug = false

# --- 10.1 Default Fallback SQLite Database ---
[tool.gda.database]
engine = "sqlite"
db_name = "archive.db"
db_path = "data/archive.db"
busy_timeout = 5000             # Milliseconds to wait under SQLite lock contention
journal_mode = "WAL"            # Write-Ahead Logging for concurrent read/write safety
foreign_keys = true             # Enforce relational foreign-key constraints on every connection
synchronous = "NORMAL"          # Balance durability and WAL write performance

# --- 10.2 Environment-Specific Database Targets ---
[tool.gda.environments.DEV]
engine = "sqlite"
db_name = "gda_dev.db"
db_path = "data/db/gda_dev.db"
timeout_seconds = 30.0

[tool.gda.environments.TEST]
engine = "sqlite"
db_name = "gda_test.db"
db_path = "data/db/gda_test.db"
timeout_seconds = 15.0

[tool.gda.environments.STAGING]
engine = "sqlite"
db_name = "gda_staging.db"
db_path = "data/db/gda_staging.db"
timeout_seconds = 30.0

[tool.gda.environments.PROD]
engine = "sqlite"
db_name = "gda_prod.db"
db_path = "data/db/gda_prod.db"
timeout_seconds = 30.0

# ------------------------------------------------------------------------------
# 11. GENDESK TOOLS (GDT) CONFIGURATION
# ------------------------------------------------------------------------------

# --- 11.1 Workspace Directory Defaults ---
[tool.gen_desk_tools.workspace]
root = "."
download_dir = "download"
archive_dir = "archive"
logs_dir = "logs"
reports_dir = "reports"
gtemp_dir = "gtemp"

# --- 11.2 Protected Domains & Backup Routing ---
[tool.gen_desk_tools.code_domains]
protected_domains = ["src", "tests", "schemas", "data/setup"]

[tool.gen_desk_tools.backup_routing]
"src/gda" = "backups_gda"
"tests/test_gda" = "backups_gda"
"src/gen_desk_tools" = "backups_gen_desk_tools"
"tests/test_gen_desk_tools" = "backups_gen_desk_tools"
"src/ancestry_desk" = "backups_ancestry_desk"
"tests/test_ancestry_desk" = "backups_ancestry_desk"
"src/cli" = "backups_cli"
"tests/test_cli" = "backups_cli"
"src/system" = "backups_system"
"tests/test_system" = "backups_system"
"schemas" = "backups_schemas"
"data/setup" = "backups_data_setup"
"default" = "backups_gen_desk_tools"

# --- 11.3 Logging & Retention Defaults ---
[tool.gen_desk_tools.logging]
log_level = "INFO"

[tool.gen_desk_tools.retention]
max_versions = 5
max_age_days = 90