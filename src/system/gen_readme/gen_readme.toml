# Path: src/system/gen_readme/gen_readme.toml
# Authoritative package documentation registry for gen_readme.py
# Scoped to audited foundation and domain model packages: gda.core, gda.io, gda.util, and gda.model

default_root = "."

# ==============================================================================
# 1. Top-Level GDA Framework & Core Infrastructure (gda.core, gda.io, gda.util)
# ==============================================================================

[[packages]]
path = "src/gda"
title = "Genealogy Digital Archive Framework (src/gda)"
role = "Top-level shared domain framework uniting core primitives, controlled enumerations, atomic/Safe-Backup I/O, helper utilities, and the five-pillar domain model suite."
test_path = "tests/test_gda"
quality_gate = "100.0% Statement & Branch Coverage"

[[packages]]
path = "src/gda/core"
title = "Core Infrastructure, Primitives & Introspection (src/gda/core)"
role = "Domain-agnostic foundational infrastructure providing canonical error taxonomies, immutable Pydantic configuration, ISO temporal/SHA-256 helpers, regex/scalar constants, structured logging, and runtime class introspection."
test_path = "tests/test_gda/test_core"
quality_gate = "100.0% Statement & Branch Coverage"

[[packages]]
path = "src/gda/core/enums"
title = "Authoritative Enumeration Domains (src/gda/core/enums)"
role = "Authoritative genealogical enumerations inheriting from StrEnum and IntEnum, governing biological sex, evidentiary certainty (QuayScore), events, jurisdictions, organizations, and archival classifications."
test_path = "tests/test_gda/test_core/test_enums"
quality_gate = "100.0% Statement & Branch Coverage"

[[packages]]
path = "src/gda/io"
title = "I/O, Safe Backup & Persistence Infrastructure (src/gda/io)"
role = "Governs physical filesystem interactions, line-ending preserving UTF-8 file access, deterministic JSON serialization, atomic temporary staging, and automated pre-execution Safe Backups."
test_path = "tests/test_gda/test_io"
quality_gate = "100.0% Statement & Branch Coverage"

[[packages]]
path = "src/gda/util"
title = "Identifier Minting, Text Sanitization & Phonetics (src/gda/util)"
role = "Pure helper algorithms for 6-digit SmartID and UUIDv4 minting/verification, high-water mark sequence extraction, Unicode/ASCII normalization, slugging, and historical phonetic encodings (Soundex, NYSIIS)."
test_path = "tests/test_gda/test_util"
quality_gate = "100.0% Statement & Branch Coverage"

# ==============================================================================
# 2. Five-Pillar Domain Model Hierarchy (src/gda/model)
# ==============================================================================

[[packages]]
path = "src/gda/model"
title = "Authoritative Domain Model Suite (src/gda/model)"
role = "Five-pillar structural data model hierarchy uniting atomic primitives (atom), composite base structures (base), canonical graph entities (entity), documentary source records (source), and derived cross-reference edges (xref)."
test_path = "tests/test_gda/test_model"
quality_gate = "100.0% Statement & Branch Coverage"

[[packages]]
path = "src/gda/model/atom"
title = "Atomic Value Objects & Identifiers (src/gda/model/atom)"
role = "Immutable Tier-0 atomic value objects enforcing strict domain constraints: 6-digit prefixed entity identifiers, RFC 4122 UUIDv4 strings, calendar dates, UTC timestamps, coordinates, scalars, and archival URNs."
test_path = "tests/test_gda/test_model/test_atom"
quality_gate = "100.0% Statement & Branch Coverage"

[[packages]]
path = "src/gda/model/base"
title = "Composite Base Value Objects & Entity Envelopes (src/gda/model/base)"
role = "Reusable Tier-1 and Tier-2 composite building blocks: audit stamps, soft-deprecation tombstones, personal/institutional names, notes, media, transcripts, source citations, base entity classes, and registry envelopes."
test_path = "tests/test_gda/test_model/test_base"
quality_gate = "100.0% Statement & Branch Coverage"

[[packages]]
path = "src/gda/model/entity"
title = "Canonical Master Graph Entities (src/gda/model/entity)"
role = "Tier-3 master domain entities extending BaseEntity and enforcing relational integrity, temporal bounds, lineage hierarchies, and participant linkages (Fact, Family, Individual, Location, Organization, Site)."
test_path = "tests/test_gda/test_model/test_entity"
quality_gate = "100.0% Statement & Branch Coverage"

[[packages]]
path = "src/gda/model/xref"
title = "Cross-Reference & Derived Relational Index Models (src/gda/model/xref)"
role = "Tier-4 decoupled, immutable relational edge dataclasses connecting individuals, families, organizations, facts, locations, sites, sources, media, and surnames with deterministic compound keys."
test_path = "tests/test_gda/test_model/test_xref"
quality_gate = "100.0% Statement & Branch Coverage"

