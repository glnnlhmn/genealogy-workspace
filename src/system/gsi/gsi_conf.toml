# Path: src/system/gsi/gsi_conf.toml

[workspace]
root = "G:/My Drive/genealogy-workspace"
download_dir = "download"
logs_dir = "logs"
reports_dir = "reports"
gtemp_dir = "gtemp"
archive_dir = "archive"

[logging]
log_file = "logs/gsi.log"
log_level = "INFO"

[backup_routing]
# Mapping of relative top-level and second-level destination segments to archive subfolders
"src/gda" = "backups_gda"
"tests/test_gda" = "backups_gda"
"src/ancestry_desk" = "backups_ancestry_desk"
"tests/test_ancestry_desk" = "backups_ancestry_desk"
"src/cli" = "backups_cli"
"tests/test_cli" = "backups_cli"
"src/system" = "backups_system"
"tests/test_system" = "backups_system"
"schemas" = "backups_schemas"
"data/setup" = "backups_data_setup"
default = "backups_system"

[code_domains]
# Directories treated as production assets subject to mandatory automated pre-write backups
protected_domains = [
    "src",
    "tests",
    "schemas",
    "data/setup"
]